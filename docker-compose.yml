version: '3.8'

services:
  app:
    build: .
    container_name: calendar_agent_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/calendar_agent
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - calendar_network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: calendar_agent_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=calendar_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - calendar_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: calendar_agent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - calendar_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  calendar_network:
    driver: bridge
