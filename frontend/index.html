<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Calendar AI Agent</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🗓️ Google Calendar AI Agent</h1>
            <p class="subtitle">자연어로 일정을 말하면 AI가 자동으로 구글 캘린더에 추가합니다</p>
        </header>

        <!-- Login Section -->
        <div id="login-section" class="card">
            <h2>로그인</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">사용자 이름</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">로그인</button>
            </form>
            <p class="toggle-auth">
                계정이 없으신가요? <a href="#" id="show-register">회원가입</a>
            </p>
        </div>

        <!-- Register Section -->
        <div id="register-section" class="card" style="display: none;">
            <h2>회원가입</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-email">이메일</label>
                    <input type="email" id="reg-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="reg-username">사용자 이름</label>
                    <input type="text" id="reg-username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">비밀번호</label>
                    <input type="password" id="reg-password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">가입하기</button>
            </form>
            <p class="toggle-auth">
                이미 계정이 있으신가요? <a href="#" id="show-login">로그인</a>
            </p>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" style="display: none;">
            <div class="header-actions">
                <div class="user-info">
                    <span id="user-display">사용자</span>
                    <button id="logout-btn" class="btn btn-secondary">로그아웃</button>
                </div>
                <button id="connect-google-btn" class="btn btn-success">
                    Google Calendar 연결
                </button>
            </div>

            <!-- Chat Section -->
            <div class="card chat-container">
                <div id="chat-messages" class="chat-messages">
                    <div class="message assistant-message">
                        <div class="message-content">
                            <p>안녕하세요! 구글 캘린더 AI 어시스턴트입니다. 🤖</p>
                            <p>자연어로 일정을 말씀해 주시면 자동으로 캘린더에 추가해 드립니다.</p>
                            <p>예: "내일 오후 3시에 팀 회의 일정 잡아줘"</p>
                        </div>
                    </div>
                </div>
                <form id="chat-form" class="chat-input-form">
                    <input 
                        type="text" 
                        id="chat-input" 
                        placeholder="일정을 입력하세요... (예: 내일 오후 2시 치과 예약)"
                        autocomplete="off"
                    >
                    <button type="submit" class="btn btn-primary">전송</button>
                </form>
            </div>

            <!-- Events Section -->
            <div class="card">
                <div class="section-header">
                    <h3>최근 일정</h3>
                    <button id="refresh-events-btn" class="btn btn-secondary">새로고침</button>
                </div>
                <div id="events-list" class="events-list">
                    <p class="loading">일정을 불러오는 중...</p>
                </div>
            </div>
        </div>

        <!-- Status Message -->
        <div id="status-message" class="status-message"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
